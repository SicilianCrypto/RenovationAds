<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kitchen Consultation</title>
<script>
/* ============================================================
   EDIT THIS FOR EACH CLIENT  (the only line you need to change)
   Keep " & " with spaces around it if the name has an ampersand,
   so the brass-colored "&" styling in the header still works.
   ============================================================ */
const BUSINESS_NAME = "Kitchen & Bath Renovations";

/* French version of the business name shown on the French page. */
const BUSINESS_NAME_FR = "Rénovations Cuisine & Salle de bain";

/* Language shown to first-time visitors: "fr" or "en".
   A visitor's own choice (the language button) is remembered, and
   a link ending in ?lang=en or ?lang=fr overrides it. */
const DEFAULT_LANG = "fr";

/* Paste your Formspree form address between the quotes, e.g.
   "https://formspree.io/f/abc123xyz"  -- leads are emailed to you.
   Leave it as-is and the page still works; it just won't email leads. */
const FORMSPREE_URL = "https://formspree.io/f/xkjgeywq";

/* Your Cal.com booking link: just the part after cal.com/
   e.g. "renovationads/meeting". Change this per client. */
const CAL_LINK = "renovationads/meeting";
/* ============================================================ */
document.title = BUSINESS_NAME + " — Kitchen Consultation";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ============================================================
     META (FACEBOOK) PIXEL — PASTE YOUR BASE CODE HERE
     ------------------------------------------------------------
     Get this from Events Manager > Data Sources > your Pixel >
     "Set up the Pixel" > paste the base <script> Meta gives you
     right below this comment. That defines the global fbq()
     function this page calls later.

     Design note: this page only fires the "Lead" event once a
     homeowner actually CONFIRMS a calendar slot — not when they
     submit the qualification form. That's on purpose: a form fill
     that never converts into a booked call shouldn't count as a
     lead for ad optimization or billing. See fireLeadEvent() near
     the bottom of the script for where this happens.
     ============================================================ -->

<!-- Meta Pixel: loads ONLY after the visitor clicks "Accept" in the cookie banner -->
<script>
const META_PIXEL_ID = '1624636202378366';
function loadMetaPixel() {
  if (window.fbq) return;
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', META_PIXEL_ID);
  fbq('track', 'PageView');
}
</script>
<!-- End Meta Pixel -->

<style>
  :root {
    --bg: #EFEBE2;
    --surface: #FBF9F4;
    --ink: #23261F;
    --ink-soft: #5C5E52;
    --brass: #A9793C;
    --brass-strong: #8F631F;
    --sage: #5F7052;
    --border: #DCD4C2;
    --danger: #A24B3C;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1D1B17;
      --surface: #27241E;
      --ink: #F1ECE1;
      --ink-soft: #C3BBA8;
      --brass: #CB9E5C;
      --brass-strong: #E0B475;
      --sage: #93A582;
      --border: #3A362C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1D1B17;
    --surface: #27241E;
    --ink: #F1ECE1;
    --ink-soft: #C3BBA8;
    --brass: #CB9E5C;
    --brass-strong: #E0B475;
    --sage: #93A582;
    --border: #3A362C;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 28px 80px; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 64px; }
  .mark { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .mark span { color: var(--brass); }
  .phone-note { font-size: 14px; color: var(--ink-soft); }
  .grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 64px; align-items: start; }
  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; gap: 40px; }
    .wrap { padding: 32px 20px 56px; }
    header.top { margin-bottom: 40px; }
  }
  .hero-copy h1 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(34px, 4.6vw, 54px);
    line-height: 1.05; letter-spacing: -0.01em; margin: 0 0 22px; max-width: 12ch;
  }
  .hero-copy p.lede { font-size: 18px; line-height: 1.55; color: var(--ink-soft); max-width: 46ch; margin: 0 0 36px; }
  .blueprint { width: 100%; height: auto; display: block; opacity: 0.9; }
  .blueprint-wrap { margin-top: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 22px; background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .blueprint-cap { font-size: 13px; color: var(--ink-soft); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 36px; }
  .step-label {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.02em; color: var(--brass-strong); background: color-mix(in srgb, var(--brass) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--brass) 35%, transparent); padding: 5px 12px; border-radius: 100px; margin-bottom: 18px;
  }
  .panel h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; margin: 0 0 6px; }
  .panel .sub { font-size: 14.5px; color: var(--ink-soft); margin: 0 0 28px; line-height: 1.5; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 7px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  input, select, textarea {
    width: 100%; font-family: 'Archivo', sans-serif; font-size: 15px; color: var(--ink);
    background: transparent; border: none; border-bottom: 1.5px solid var(--border);
    padding: 9px 2px; outline: none; transition: border-color 0.15s ease;
  }
  select { appearance: none; background: transparent; cursor: pointer; }
  select option { color: #23261F; }
  input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: 0.55; }
  input:focus, select:focus, textarea:focus { border-bottom-color: var(--brass); }
  textarea { resize: vertical; min-height: 60px; }
  .submit-btn {
    width: 100%; margin-top: 8px; background: var(--brass); color: #FBF9F4; border: none; border-radius: 4px;
    padding: 15px 20px; font-size: 15px; font-weight: 600; font-family: 'Archivo', sans-serif; cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .submit-btn:hover { background: var(--brass-strong); }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }
  .privacy-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 14px; text-align: center; }
  .error-note { margin-top: 16px; font-size: 13.5px; color: var(--danger); display: none; }
  .error-note.show { display: block; }

  /* Field-level validation errors (email / phone) */
  .field-error { font-size: 12px; color: var(--danger); margin-top: 5px; display: none; }
  .field-error.show { display: block; }

  /* Subtle post-fill reminder */
  .subtle-reminder {
    display: flex; align-items: center; gap: 8px; margin-top: 4px; margin-bottom: 4px;
    font-size: 12.5px; color: var(--ink-soft); opacity: 0; max-height: 0; overflow: hidden;
    transition: opacity 0.25s ease;
  }
  .subtle-reminder.show { opacity: 1; max-height: 60px; margin-bottom: 6px; }
  .reminder-badge {
    flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%;
    background: color-mix(in srgb, var(--brass) 22%, transparent); color: var(--brass-strong);
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  /* Decline / hard-exit state */
  .decline-box { text-align: center; padding: 20px 6px 6px; }
  .decline-box .result-badge {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 100px; margin-bottom: 16px;
    background: color-mix(in srgb, var(--brass) 22%, transparent); color: var(--brass-strong);
  }
  .decline-box .result-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .decline-box h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 19px; margin: 0 0 10px; text-align: left; }
  .decline-box p { font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 6px; text-align: left; }
  .decline-box .next-step { margin-top: 14px; padding: 14px 16px; background: var(--bg); border-radius: 4px; font-size: 14px; color: var(--ink); text-align: left; }
  .start-over-btn {
    margin-top: 20px; background: none; border: 1px solid var(--border); color: var(--ink);
    padding: 10px 16px; border-radius: 4px; font-family: 'Archivo', sans-serif; font-size: 13.5px; cursor: pointer;
  }
  .start-over-btn:hover { border-color: var(--brass); color: var(--brass-strong); }

  /* Calendar step */
  .confirming-as {
    font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; padding: 10px 12px;
    background: var(--bg); border-radius: 4px;
  }
  .confirming-as b { color: var(--ink); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .cal-month { font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; }
  .cal-nav button {
    background: none; border: 1px solid var(--border); color: var(--ink);
    width: 30px; height: 30px; border-radius: 4px; cursor: pointer; font-size: 15px;
  }
  .cal-nav button:hover { border-color: var(--brass); color: var(--brass-strong); }
  .cal-nav button:disabled { opacity: 0.3; cursor: default; }
  .dow-row, .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow-row { margin-bottom: 6px; }
  .dow-row span { text-align: center; font-size: 11.5px; color: var(--ink-soft); font-weight: 500; }
  .day-grid { margin-bottom: 24px; }
  .day-grid button {
    aspect-ratio: 1; border: none; background: transparent; color: var(--ink);
    font-family: 'Archivo', sans-serif; font-size: 13.5px; border-radius: 5px; cursor: pointer;
  }
  .day-grid button:not(:disabled):hover { background: color-mix(in srgb, var(--brass) 14%, transparent); }
  .day-grid button:disabled { color: var(--ink-soft); opacity: 0.28; cursor: default; }
  .day-grid button.selected { background: var(--brass); color: #FBF9F4; font-weight: 600; }
  .day-grid button.empty { visibility: hidden; }
  .slots-title { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .slot-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .slot-list button {
    border: 1px solid var(--border); background: transparent; color: var(--ink);
    font-family: 'Archivo', sans-serif; font-size: 13.5px; padding: 10px 8px; border-radius: 5px; cursor: pointer;
  }
  .slot-list button:hover { border-color: var(--brass); }
  .slot-list button.selected { background: var(--brass); border-color: var(--brass); color: #FBF9F4; font-weight: 600; }
  .empty-note { font-size: 13.5px; color: var(--ink-soft); padding: 10px 0 0; }
  .confirm-box { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

  .booked-state { text-align: center; padding: 20px 6px 6px; }
  .booked-state .check { font-size: 30px; margin-bottom: 12px; }
  .booked-state h3 { font-family: 'Fraunces', serif; font-size: 19px; margin: 0 0 8px; font-weight: 500; }
  .booked-state p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0; }

  /* Cookie banner + footer */
  .foot { margin-top: 48px; text-align: center; font-size: 13px; color: var(--ink-soft); }
  .foot a { color: var(--ink-soft); }
  .foot a:hover { color: var(--brass-strong); }
  .cookie-banner {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
    justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .cookie-card {
    pointer-events: auto; max-width: 720px; width: 100%; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.18);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .cookie-card p { flex: 1 1 320px; margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }
  .cookie-card p b { color: var(--ink); font-weight: 600; }
  .cookie-card a { color: var(--brass-strong); }
  .cookie-actions { display: flex; gap: 10px; flex: 0 0 auto; }
  .cookie-actions button {
    font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 600; padding: 10px 18px;
    border-radius: 5px; cursor: pointer; border: 1px solid var(--brass);
  }
  #cookieAccept { background: var(--brass); color: #FBF9F4; }
  #cookieAccept:hover { background: var(--brass-strong); border-color: var(--brass-strong); }
  #cookieDecline { background: transparent; color: var(--ink); border-color: var(--border); }
  #cookieDecline:hover { border-color: var(--brass); color: var(--brass-strong); }
  @media (max-width: 560px) {
    .cookie-actions { width: 100%; }
    .cookie-actions button { flex: 1; }
  }

  /* Language toggle */
  .top-right { display: flex; align-items: center; gap: 18px; }
  .lang-toggle {
    background: none; border: 1px solid var(--border); color: var(--ink); border-radius: 100px;
    padding: 6px 14px; font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .lang-toggle:hover { border-color: var(--brass); color: var(--brass-strong); }
  @media (max-width: 560px) { .phone-note { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" id="brandName"></div>
    <div class="top-right">
      <div class="phone-note" data-i18n="serving">Serving the Greater Montréal area</div>
      <button type="button" class="lang-toggle" id="langToggle"></button>
    </div>
  </header>

  <div class="grid">
    <div class="hero-copy">
      <h1 data-i18n="hero_h1"></h1>
      <p class="lede" data-i18n="hero_lede"></p>

      <div class="blueprint-wrap">
        <svg class="blueprint" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="var(--ink)" stroke-width="1.4">
            <rect x="14" y="14" width="392" height="232" rx="2" stroke-opacity="0.35"/>
            <path d="M14 14 L14 130 L110 130 L110 246" stroke-opacity="0.55"/>
            <rect x="24" y="24" width="70" height="28" stroke-opacity="0.5"/>
            <rect x="24" y="60" width="70" height="60" stroke-opacity="0.5"/>
            <line x1="24" y1="90" x2="94" y2="90" stroke-opacity="0.3"/>
            <rect x="150" y="150" width="130" height="60" rx="1" stroke-opacity="0.55"/>
            <line x1="150" y1="180" x2="280" y2="180" stroke-opacity="0.3"/>
            <circle cx="185" cy="165" r="6" stroke-opacity="0.4"/>
            <circle cx="205" cy="165" r="6" stroke-opacity="0.4"/>
            <rect x="320" y="24" width="66" height="90" stroke-opacity="0.5"/>
            <line x1="320" y1="69" x2="386" y2="69" stroke-opacity="0.3"/>
            <path d="M110 130 L406 130" stroke-opacity="0.2" stroke-dasharray="2 4"/>
          </g>
        </svg>
        <div class="blueprint-cap" data-i18n="blueprint_cap"></div>
      </div>
    </div>

    <div class="panel" id="panel">
      <!-- ===================== STEP 1: FORM ===================== -->
      <div id="stepForm">
        <div class="step-label" data-i18n="step1"></div>
        <h2 data-i18n="form_h2"></h2>
        <p class="sub" data-i18n="form_sub"></p>

        <form id="leadForm">
          <div class="field">
            <label for="name" data-i18n="lbl_name"></label>
            <input id="name" required data-i18n-ph="ph_name" placeholder="Jordan Ellis" />
          </div>
          <div class="row2">
            <div class="field">
              <label for="email" data-i18n="lbl_email"></label>
              <input id="email" type="email" required data-i18n-ph="ph_email" placeholder="you@email.com" />
              <p class="field-error" id="emailError"></p>
            </div>
            <div class="field">
              <label for="phone" data-i18n="lbl_phone"></label>
              <input id="phone" type="tel" required data-i18n-ph="ph_phone" placeholder="(514) 204-7788" />
              <p class="field-error" id="phoneError"></p>
            </div>
          </div>
          <div class="field">
            <label for="timeline" data-i18n="lbl_timeline"></label>
            <select id="timeline" required>
              <option value="" disabled selected data-i18n="o_select_time"></option>
              <option value="As soon as possible" data-i18n="t_asap"></option>
              <option value="Within 1-3 months" data-i18n="t_1_3"></option>
              <option value="3-6 months" data-i18n="t_3_6"></option>
              <option value="Just exploring, no firm date" data-i18n="t_explore"></option>
            </select>
          </div>
          <div class="row2">
            <div class="field">
              <label for="budget" data-i18n="lbl_budget"></label>
              <select id="budget" required>
                <option value="" disabled selected data-i18n="o_select_range"></option>
                <option value="Under $5,000" data-i18n="b_under5"></option>
                <option value="$5,000-$15,000" data-i18n="b_5_15"></option>
                <option value="$15,000-$35,000" data-i18n="b_15_35"></option>
                <option value="$35,000-$75,000" data-i18n="b_35_75"></option>
                <option value="$75,000+" data-i18n="b_75"></option>
                <option value="Not sure yet" data-i18n="b_unsure"></option>
              </select>
            </div>
            <div class="field">
              <label for="scope" data-i18n="lbl_scope"></label>
              <select id="scope" required>
                <option value="" disabled selected data-i18n="o_select_scope"></option>
                <option value="Full gut renovation" data-i18n="s_gut"></option>
                <option value="Kitchen/Bathroom Remodeling" data-i18n="s_remodel"></option>
                <option value="Cabinets and countertops only" data-i18n="s_cab"></option>
                <option value="Cosmetic refresh (paint, hardware, fixtures)" data-i18n="s_cosm"></option>
                <option value="Other" data-i18n="s_other"></option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="owns" data-i18n="lbl_owns"></label>
              <select id="owns" required>
                <option value="" disabled selected data-i18n="o_select_one"></option>
                <option value="Yes, I own it" data-i18n="ow_yes"></option>
                <option value="No, I rent" data-i18n="ow_rent"></option>
                <option value="I'm the landlord/property manager" data-i18n="ow_land"></option>
              </select>
            </div>
            <div class="field">
              <label for="city" data-i18n="lbl_city"></label>
              <input id="city" required data-i18n-ph="ph_city" placeholder="Montréal, QC" />
            </div>
          </div>
          <div class="field">
            <label for="notes" data-i18n="lbl_notes"></label>
            <textarea id="notes" data-i18n-ph="ph_notes" placeholder="Open concept, new appliances, matching an existing style, etc."></textarea>
            <div class="subtle-reminder" id="subtleReminder">
              <span class="reminder-badge">!</span>
              <span data-i18n="reminder"></span>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn" data-i18n="submit"></button>
          <p class="privacy-note" id="privacyNote"></p>
          <p class="error-note" id="errorNote" data-i18n="error_note"></p>
        </form>
      </div>

      <!-- ============== HARD EXIT STATE (ownership / budget / timeline) ============== -->
      <div id="stepHardExit" style="display:none;">
        <div class="decline-box">
          <div class="result-badge"><span class="dot"></span><span data-i18n="exit_badge"></span></div>
          <h3 id="hardExitHeadline"></h3>
          <p id="hardExitBody"></p>
          <button class="submit-btn" id="hardExitBtn" style="margin-top:18px;" data-i18n="exit_btn"></button>
        </div>
      </div>

      <!-- ===================== STEP 2: CALENDAR (Cal.com) ===================== -->
      <div id="stepCalendar" style="display:none;">
        <div class="step-label" data-i18n="step2"></div>
        <h2 data-i18n="cal_h2"></h2>
        <p class="sub" id="qualifiedHeadline"></p>

        <div class="confirming-as" id="confirmingAs"></div>

        <div id="calEmbed" style="width:100%; min-height:520px; overflow:auto;"></div>
        <p class="privacy-note" id="calFallbackWrap"></p>
      </div>

      <!-- ===================== BOOKED STATE ===================== -->
      <div id="stepBooked" style="display:none;">
        <div class="booked-state">
          <div class="check">✅</div>
          <h3 data-i18n="booked_h3"></h3>
          <p id="bookedDetails" data-i18n="booked_details"></p>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">

<script>
/* Cookie consent: the Meta Pixel only loads after "Accept". */
(function () {
  const KEY = 'cookie_consent';
  function getChoice() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function setChoice(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  const banner = document.getElementById('cookieBanner');
  function show() { banner.style.display = 'flex'; }
  function hide() { banner.style.display = 'none'; }

  document.getElementById('cookieAccept').addEventListener('click', function () {
    setChoice('accepted'); hide(); loadMetaPixel();
  });
  document.getElementById('cookieDecline').addEventListener('click', function () {
    const was = getChoice();
    setChoice('declined'); hide();
    if (was === 'accepted') location.reload(); // stops the pixel that was already running
  });
  document.getElementById('cookieSettings').addEventListener('click', function (e) {
    e.preventDefault(); show();
  });

  const choice = getChoice();
  if (choice === 'accepted') loadMetaPixel();
  else if (choice !== 'declined') show();
})();
</script>

/* ============================================================
   VALIDATION: email format + North American (US/Canada) phone
   ============================================================
   Note: this checks FORMAT and rules out obvious placeholders —
   it cannot confirm a number is real/reachable (that needs a
   paid lookup service like Twilio Lookup). It rejects:
     - anything that isn't a 10-digit US/Canada (NANP) number
     - invalid area codes / N11 service codes (211, 911, etc.)
     - the classic fake "555" exchange
     - all-identical-digit and perfectly sequential numbers
     - NANP area codes belonging to Caribbean nations, not US/Canada
   ============================================================ */
const EMAIL_RE = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;

function isValidEmailFormat(str) {
  return EMAIL_RE.test((str || '').trim());
}

const NON_US_CA_AREA_CODES = new Set([
  '242','246','264','268','284','345','441','473','649','658',
  '664','721','758','767','784','809','829','849','868','869','876'
]);

function isValidNANPPhone(raw) {
  let d = (raw || '').replace(/\D/g, '');
  if (d.length === 11) {
    if (d[0] !== '1') return false;
    d = d.slice(1);
  }
  if (d.length !== 10) return false;

  const area = d.slice(0, 3);
  const exch = d.slice(3, 6);

  const validGroup = /^[2-9]\d{2}$/;
  const n11 = /^[2-9]11$/;

  if (!validGroup.test(area) || n11.test(area)) return false;
  if (!validGroup.test(exch) || n11.test(exch)) return false;
  if (NON_US_CA_AREA_CODES.has(area)) return false;
  if (exch === '555') return false;
  if (/^(\d)\1{9}$/.test(d)) return false;
  if (['0123456789', '1234567890', '9876543210', '0987654321'].includes(d)) return false;

  return true;
}

document.getElementById('hardExitBtn').addEventListener('click', () => {
  // 1) Works if the page was opened by a script / some in-app browsers
  try { window.close(); } catch (e) {}
  // 2) Browsers usually block close() on a normally opened tab, so if we're
  //    still here, send the visitor back to where they came from (e.g. Facebook),
  //    or to a blank page if there is nothing to go back to.
  setTimeout(function () {
    if (window.history.length > 1) {
      window.history.back();

      window.location.replace('about:blank');

/* ============================================================
   STEP 1 -> QUALIFICATION
   ============================================================ */
function handleSubmit(e) {
  e.preventDefault();
  const errorNote = document.getElementById('errorNote');
  errorNote.classList.remove('show');

  clearFieldError('emailError');
  clearFieldError('phoneError');
  const emailVal = document.getElementById('email').value;
  const phoneVal = document.getElementById('phone').value;
  let hasFieldError = false;
  if (!isValidEmailFormat(emailVal)) {
    showFieldError('emailError', t('err_email'));
    hasFieldError = true;
  }
  if (!isValidNANPPhone(phoneVal)) {
    showFieldError('phoneError', t('err_phone'));
    hasFieldError = true;
  }
  if (hasFieldError) return;

  Object.assign(lead, {
    name: document.getElementById('name').value,
    email: emailVal,
    phone: phoneVal,
    timeline: document.getElementById('timeline').value,
    budget: document.getElementById('budget').value,
    scope: document.getElementById('scope').value,
    owns: document.getElementById('owns').value,
    city: document.getElementById('city').value,
    notes: document.getElementById('notes').value || 'none provided',
  });

  // Safety-net: these three should already be caught live by the
  // on-change gates above, but they're re-checked here in case of
  // programmatic changes (e.g. browser autofill skipping events).
  if (HARD_DISQUALIFY_BUDGETS.includes(lead.budget)) {
    showHardExit('budget');
    return;
  }
  if (lead.owns === "No, I rent") {
    showHardExit('rent');
    return;
  }
  if (lead.timeline === "Just exploring, no firm date") {
    showHardExit('timeline');
    return;
  }

  // Everyone who clears the gates above goes straight to booking.
  // The lead is emailed to you in the background; if that ever fails,
  // the homeowner never sees it and still moves on to the calendar.
  sendToFormspree('Qualified, reached calendar (not booked yet)');
  renderCalendarStep();
}

/* ============================================================
   EMAIL THE LEAD TO YOU (via Formspree) -- never blocks the page
   ============================================================ */
function sendToFormspree(stage, extra) {
  try {
    if (!FORMSPREE_URL || FORMSPREE_URL.indexOf('PASTE_') === 0) return;
    const payload = Object.assign({
      _subject: 'New lead (' + stage + ') - ' + BUSINESS_NAME,
      stage: stage,
      business: BUSINESS_NAME,
      name: lead.name,
      email: lead.email,
      phone: lead.phone,
      timeline: lead.timeline,
      budget: lead.budget,
      scope: lead.scope,
      owns_home: lead.owns,
      city: lead.city,
      notes: lead.notes,
      page: window.location.href
    }, extra || {});
    fetch(FORMSPREE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(function () { /* fail silently */ });
  } catch (e) { /* fail silently */ }
}
document.getElementById('leadForm').addEventListener('submit', handleSubmit);

   Availability comes from your Cal.com account, which syncs with

let calLoaded = false;

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function loadCalEmbed() {
  if (calLoaded) return;
  calLoaded = true;

  // Official Cal.com embed loader
  (function (C, A, L) {
    let p = function (a, ar) { a.q.push(ar); };
    let d = C.document;
    C.Cal = C.Cal || function () {
      let cal = C.Cal; let ar = arguments;
      if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; }
      if (ar[0] === L) {
        const api = function () { p(api, arguments); };
        const namespace = ar[1];
        api.q = api.q || [];
        if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); }
        else p(cal, ar);
        return;
      }
      p(cal, ar);
    };
  })(window, "https://app.cal.com/embed/embed.js", "init");

  Cal("init", "consult", { origin: "https://app.cal.com" });

  // Only pass along what the homeowner typed in the additional notes box
  const notes = (lead.notes && lead.notes.trim().toLowerCase() !== 'none provided') ? lead.notes.trim() : '';

  Cal.ns.consult("inline", {
    elementOrSelector: "#calEmbed",
    calLink: CAL_LINK,
    layout: "month_view",
    config: { name: lead.name || '', email: lead.email || '', notes: notes, theme: "auto" }
  });
  Cal.ns.consult("ui", { hideEventTypeDetails: false, layout: "month_view" });

  // Fires when the homeowner actually confirms a time. THIS is "a lead".
  Cal.ns.consult("on", {
    action: "bookingSuccessful",
    callback: function (e) {
      let when = '';
      try {
        const d = e && e.detail && e.detail.data;
        if (d && d.date) when = d.date;
      } catch (err) {}
      sendToFormspree('BOOKED a time', { booked_slot: when });
      fireLeadEvent();
    }
  });
}

function renderCalendarStep() {
  renderCalendarTexts();

  // Optional: uncomment if you want Meta to see "qualified, entered
  // booking step" as its own signal before a slot is actually confirmed.
  // if (typeof fbq === 'function') fbq('trackCustom', 'QualifiedEnteredBooking');

  showStep('calendar');
  loadCalEmbed();
}

/* ============================================================
   META PIXEL "Lead" EVENT: only after a booking is confirmed
   ============================================================ */
function fireLeadEvent() {
  try {
    if (typeof fbq === 'function') {
      fbq('track', 'Lead', {
        content_name: 'Kitchen Renovation Consultation',
        value: budgetMidpoint(lead.budget),
        currency: 'CAD'
      });
    }
    // If fbq isn't defined yet, nothing breaks — just add your Meta
    // Pixel base code in <head> (see the comment up top) to activate this.
  } catch (e) { /* fail silently — never block the booked confirmation on pixel issues */ }
}

/* Apply the chosen language to the whole page */
applyLang();
</script>
</body>
</html>
